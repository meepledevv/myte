<div id="loadingScreen">
    <div class="loadingBox">
        <div class="loadingTitle">Loading Myte</div>
        <div id="loadingText" class="loadingText">
            Loading PlayFab...
        </div>

        <button
            id="retryButton"
            onclick="retryPlayFab()"
            style="
                display:none;
                margin-top:20px;
                padding:10px 22px;
                background:#694080;
                color:white;
                border:0;
                cursor:pointer;
            ">
            Retry
        </button>
    </div>
</div>

<script>
const TITLE_ID = "16F240";

let playFabReady = false;
let playFabAttempts = 0;

function setLoading(text) {
    const element =
        document.getElementById("loadingText");

    if (element) {
        element.textContent = text;
    }
}

function retryPlayFab() {

    playFabAttempts = 0;

    const retry =
        document.getElementById("retryButton");

    if (retry) {
        retry.style.display = "none";
    }

    setLoading("Loading PlayFab...");

    checkPlayFab();
}

function checkPlayFab() {

    if (
        typeof PlayFab !== "undefined" &&
        typeof PlayFabClientSDK !== "undefined"
    ) {

        playFabReady = true;

        PlayFab.settings.titleId =
            TITLE_ID;

        setLoading(
            "Checking account..."
        );

        restoreSession();

        return;
    }

    playFabAttempts++;

    if (playFabAttempts >= 40) {

        setLoading(
            "PlayFab could not be loaded."
        );

        const retry =
            document.getElementById(
                "retryButton"
            );

        if (retry) {
            retry.style.display =
                "inline-block";
        }

        return;
    }

    setTimeout(
        checkPlayFab,
        250
    );
}

function restoreSession() {

    if (
        typeof PlayFabClientSDK ===
        "undefined"
    ) {

        showLogin();

        return;
    }

    PlayFabClientSDK.GetAccountInfo(
        {},
        function(result, error) {

            if (error) {

                showLogin();

                return;
            }

            currentPlayFabId =
                result.data.PlayFabId;

            currentUsername =
                result.data.Username || "";

            loadPlayerData(
                function() {
                    enterDashboard();
                }
            );
        }
    );
}

window.addEventListener(
    "load",
    function() {

        setLoading(
            "Loading PlayFab..."
        );

        checkPlayFab();

    }
);
</script>
